name: Deploy Storybook to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 20 is deprecated on GitHub Actions runners.
          node-version: 22
          # Disable cache while diagnosing npm ci failures.
          # cache: npm

      - name: Install dependencies
        env:
          # Storybook build does not need Playwright browsers.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          node -v
          npm -v
          if ! npm ci --no-audit --no-fund; then
            echo "::group::npm debug logs"
            ls -la ~/.npm/_logs || true
            for f in ~/.npm/_logs/*-debug-*.log; do
              [ -f "$f" ] || continue
              echo "===== $f ====="
              tail -n 80 "$f" || true
            done
            echo "::endgroup::"
            # Surface the real error in public annotations (no login needed).
            err="$(grep -E 'npm ERR!|error |ERESOLVE|Invalid|ENOENT|EUSAGE' ~/.npm/_logs/*-debug-*.log 2>/dev/null | tail -n 20 | tr '\n' ' ' | cut -c1-600)"
            echo "::error::npm ci failed: ${err:-see npm debug logs group}"
            exit 1
          fi

      - name: Build Storybook
        run: npm run build-storybook

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
