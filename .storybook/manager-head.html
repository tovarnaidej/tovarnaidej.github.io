<link rel="icon" type="image/svg+xml" href="/branding/favicon.svg" />
<link rel="stylesheet" href="/fonts/republika.css" />
<style>
  #storybook-sidebar-region {
    background-color: #0b3a4a;
    background-image: url('/branding/gradient.svg');
    background-position: center;
    background-size: cover;
    color: #ffffff;
  }

  #storybook-sidebar-region a,
  #storybook-sidebar-region button,
  #storybook-sidebar-region [role='treeitem'],
  #storybook-sidebar-region [role='heading'],
  #storybook-sidebar-region label,
  #storybook-sidebar-region input,
  #storybook-sidebar-region svg {
    color: #ffffff !important;
  }

  #storybook-sidebar-region svg {
    fill: currentColor;
  }

  #storybook-explorer-searchfield::placeholder {
    color: rgba(255, 255, 255, 0.78) !important;
    opacity: 1;
  }

  #storybook-explorer-searchfield:focus {
    color: #0b3a4a !important;
    caret-color: #0b3a4a;
  }

  #storybook-explorer-searchfield:focus::placeholder {
    color: rgba(11, 58, 74, 0.68) !important;
  }

  #storybook-sidebar-region [role='treeitem']:hover {
    background-color: rgba(11, 58, 74, 0.34) !important;
  }

  #storybook-sidebar-region [data-selected='true'],
  #storybook-sidebar-region [aria-current='page'] {
    background-color: rgba(11, 58, 74, 0.72) !important;
    color: #ffffff !important;
  }

  #storybook-sidebar-region [data-selected='true'] *,
  #storybook-sidebar-region [aria-current='page'] * {
    color: #ffffff !important;
  }

  #storybook-sidebar-region img[alt="mSlovenija gradniki"] {
    width: 176px;
    max-height: 52px;
    object-fit: contain;
    object-position: left center;
  }
</style>
<script>
  (() => {
    const translations = new Map([
      ['Controls', 'Nastavitve'],
      ['Actions', 'Dejanja'],
      ['Interactions', 'Interakcije'],
      ['Visual tests', 'Vizualni testi'],
      ['Accessibility', 'Dostopnost'],
      ['HTML', 'Koda'],
      ['Copy', 'Kopiraj'],
      ['Copied', 'Kopirano'],
      ['Name', 'Ime'],
      ['Control', 'Nastavitev'],
      ['True', 'Da'],
      ['False', 'Ne'],
      ['Recently opened', 'Nedavno odprto'],
      ['Set boolean', 'Nastavi logično vrednost'],
      ['Set string', 'Nastavi besedilo'],
      ['label', 'Besedilo'],
      ['variant', 'Različica'],
      ['state', 'Stanje'],
      ['leadingIcon', 'Vodilna ikona'],
      ['trailingIcon', 'Končna ikona'],
      ['disabled', 'Onemogočen'],
      ['fullWidth', 'Polna širina'],
      ['className', 'Razred CSS'],
      ['onClick', 'Ob kliku'],
      ['hierarchy', 'Hierarhija'],
      ['size', 'Velikost'],
      ['filled', 'Polni'],
      ['elevated', 'Dvignjeni'],
      ['regular', 'Običajna'],
      ['enabled', 'Omogočen'],
      ['primary', 'Primarni'],
      ['secondary', 'Sekundarni'],
      ['outline', 'Obroba'],
      ['text', 'Besedilni'],
      ['small', 'Majhen'],
      ['medium', 'Srednji'],
      ['large', 'Velik'],
      ['default', 'Privzeto'],
      ['hover', 'Lebdenje'],
      ['focus', 'Fokus'],
      ['pressed', 'Pritisnjen'],
      ['Privzdignjeni', 'Senca'],
    ]);

    /*
      Hide noisy addon tabs, keep Nastavitve / Dostopnost / Koda.
      Match labels with startsWith — Storybook badges concatenate
      ("Nastavitve15"), so exact equality fails and used to leave
      Interactions selected while its tab was display:none.

      Koda is mutual-exclusive:
      - Gradniki - mobile → platform panel (title "Koda")
      - everything else → HTML panel (translated to "Koda")
    */
    const alwaysHiddenPanelLabels = [
      'Actions',
      'Dejanja',
      'Interactions',
      'Interakcije',
      'Visual tests',
      'Vizualni testi',
      'Code',
    ];
    const preferredPanelLabels = [
      'Controls',
      'Nastavitve',
      'HTML',
      'Koda',
      'Accessibility',
      'Dostopnost',
    ];
    const keptPanelLabels = preferredPanelLabels;

    const tabLabel = (tab) => (tab?.textContent || '').replace(/\s+/g, ' ').trim();
    const labelMatches = (text, labels) =>
      labels.some((label) => text === label || text.startsWith(label));

    const isMobileStory = () =>
      /gradniki-mobile/i.test(
        `${window.location.pathname}${window.location.search}${window.location.hash}`,
      );

    const getMainPanelTabList = () => {
      const root = document.querySelector('#storybook-panel-root');
      if (!root) return null;
      // First tablist is the addon switcher; nested lists are a11y sub-tabs.
      return root.querySelector('[role="tablist"]');
    };

    const tagPanelKind = (tab) => {
      if (tab.dataset.msPanelKind) return tab.dataset.msPanelKind;
      const label = tabLabel(tab);
      if (label === 'HTML' || label.startsWith('HTML')) {
        tab.dataset.msPanelKind = 'html';
      } else if (label === 'Koda' || label.startsWith('Koda')) {
        // Platform panel is registered as "Koda"; HTML is still "HTML"
        // when we first see it (before translation).
        tab.dataset.msPanelKind = 'platform';
      } else if (labelMatches(label, ['Controls', 'Nastavitve'])) {
        tab.dataset.msPanelKind = 'controls';
      } else if (labelMatches(label, ['Accessibility', 'Dostopnost'])) {
        tab.dataset.msPanelKind = 'a11y';
      } else {
        tab.dataset.msPanelKind = 'other';
      }
      return tab.dataset.msPanelKind;
    };

    const ensurePreferredPanel = (tabList) => {
      if (!tabList) return;
      const mobile = isMobileStory();
      const tabs = [...tabList.querySelectorAll(':scope > [role="tab"]')];
      if (!tabs.length) {
        // Fallback if Storybook nests tabs without :scope >.
        tabs.push(...tabList.querySelectorAll('[role="tab"]'));
      }

      const visible = tabs.filter((tab) => {
        const label = tabLabel(tab);
        const kind = tagPanelKind(tab);

        if (labelMatches(label, alwaysHiddenPanelLabels)) {
          tab.style.display = 'none';
          return false;
        }

        if (mobile) {
          if (kind === 'html') {
            tab.style.display = 'none';
            return false;
          }
        } else if (kind === 'platform') {
          tab.style.display = 'none';
          return false;
        }

        if (labelMatches(label, keptPanelLabels) || kind === 'html' || kind === 'platform') {
          tab.style.display = '';
          return true;
        }
        return getComputedStyle(tab).display !== 'none';
      });

      const selected = tabs.find((tab) => tab.getAttribute('aria-selected') === 'true');
      const selectedHidden =
        selected &&
        (getComputedStyle(selected).display === 'none' ||
          labelMatches(tabLabel(selected), alwaysHiddenPanelLabels));

      if (selectedHidden || !selected) {
        const next =
          visible.find((tab) => labelMatches(tabLabel(tab), ['Controls', 'Nastavitve'])) ||
          visible[0];
        next?.click();
      }
    };

    let scheduled = false;
    const translateManager = () => {
      if (scheduled) return;
      scheduled = true;
      requestAnimationFrame(() => {
        scheduled = false;

        const search = document.querySelector('#storybook-explorer-searchfield');
        if (search && search.placeholder !== 'Poišči gradnike') {
          search.placeholder = 'Poišči gradnike';
          search.setAttribute('aria-label', 'Poišči gradnike');
        }

        document.querySelectorAll('#storybook-sidebar-region *').forEach((element) => {
          element.childNodes.forEach((node) => {
            if (node.nodeType !== Node.TEXT_NODE) return;

            const original = node.textContent.trim();
            const translation = translations.get(original);
            if (translation) {
              node.textContent = node.textContent.replace(original, translation);
            }
          });
        });

        const tabList = getMainPanelTabList();
        ensurePreferredPanel(tabList);

        document.querySelectorAll('#storybook-panel-root *').forEach((element) => {
          if (element.closest('pre, code, .cm-editor, .monaco-editor, [data-radix-scroll-area-viewport] pre')) {
            return;
          }

          element.childNodes.forEach((node) => {
            if (node.nodeType !== Node.TEXT_NODE) return;

            const original = node.textContent.trim();
            const translation = translations.get(original);
            if (translation) {
              node.textContent = node.textContent.replace(original, translation);
            }
          });
        });
      });
    };

    const observer = new MutationObserver(translateManager);
    const start = () => {
      translateManager();
      observer.observe(document.body, { childList: true, subtree: true });
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', start, { once: true });
    } else {
      start();
    }
  })();
</script>
